@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Great+Vibes&family=Karla:wght@400;500;600;700&display=swap');

.ag-palco{
  --bg:#F5F3EF; --sup:#FFFFFF; --ink:#332F29; --soft:#756E63; --fraco:#A79D8E;
  --linha:#E7E1D6; --ouro:#8A6A2E; --ouro-esc:#584520; --ouro-cl:#F3ECDC;
  --sage:#5F7457; --sage-cl:#E7EEE3; --amb:#A85E3C; --amb-cl:#F7E8E0;
  --erro:#A6413F; --brilho:#C9A961; --noite:#2A2521;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --script:'Great Vibes','Brush Script MT',cursive;
  --sans:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  min-height:100dvh; display:flex; flex-direction:column; align-items:stretch;
  padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.ag-palco *,.ag-palco *::before,.ag-palco *::after{box-sizing:border-box;}
.ag-palco button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;}
.ag-palco button:active{opacity:.72;}
.ag-palco button:disabled{cursor:not-allowed;}
.ag-palco :focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:4px;}

.ag-palco .ag-fone{
  width:100%;height:100dvh;background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column;position:relative;
}

.ag-palco .ag-topo{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;flex-shrink:0;min-height:56px;}
.ag-palco .ag-marca{display:inline-flex;align-items:center;gap:7px;font-family:var(--script);font-size:27px;line-height:1;color:var(--ouro);}
.ag-palco .ag-voltar{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sup);color:var(--ink);border:1px solid var(--linha);}
.ag-palco .ag-sino{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sup);border:1px solid var(--linha);color:var(--soft);}
.ag-palco .ag-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ouro);color:#fff;font-size:10px;font-weight:700;font-style:normal;display:grid;place-items:center;border:2px solid var(--bg);}
.ag-palco .ag-badge-peq{top:-5px;right:-8px;}

.ag-palco .ag-aviso{margin:2px 14px 8px;display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;text-align:left;flex-shrink:0;animation:entra .28s ease-out;}
.ag-palco .ag-aviso.tipo-confirmado{background:var(--sage-cl);color:#3D4F37;}
.ag-palco .ag-aviso.tipo-recusado{background:#EFEAE2;color:#5A5349;}
.ag-palco .ag-aviso.tipo-novo{background:var(--amb-cl);color:#7A3F22;}
.ag-palco .ag-aviso-i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.7);flex-shrink:0;}
.ag-palco .ag-aviso-t{flex:1;font-size:13.5px;font-weight:600;line-height:1.35;}
@keyframes entra{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

.ag-palco .ag-corpo{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.ag-palco .ag-tela{padding:4px 18px 26px;display:flex;flex-direction:column;}
.ag-palco .ag-centro{align-items:center;justify-content:center;text-align:center;min-height:100%;}
.ag-palco .ag-centro-txt{text-align:center;}
.ag-palco .ag-ml{margin-left:auto;}
.ag-palco .ag-mt{margin-top:9px;}
.ag-palco .ag-mt-g{margin-top:26px;}
.ag-palco .ag-mb{margin-bottom:10px;}
.ag-palco .ag-larga{width:100%;}

/* abertura */
.ag-palco .ag-abertura{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:100%;padding:8px 22px 28px;overflow:hidden;}
.ag-palco .ag-abertura-topo{padding-top:18px;position:relative;z-index:1;}
.ag-palco .ag-marca-dagua{position:absolute;top:-56px;right:-96px;color:var(--ouro);opacity:.07;pointer-events:none;}
.ag-palco .ag-abertura-frase{margin:20px 0 0;font-size:16px;line-height:1.55;color:var(--soft);max-width:27ch;}
.ag-palco .ag-passos-lista{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:13px;}
.ag-palco .ag-passos-lista li{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;line-height:1.45;color:var(--ink);}
.ag-palco .ag-passo-icone{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--ouro-cl);color:var(--ouro);flex-shrink:0;}
.ag-palco .ag-topo-vazio{min-height:14px;padding-bottom:0;}
.ag-palco .ag-marca-bloco{display:flex;flex-direction:column;align-items:flex-start;}
.ag-palco .ag-simbolo{color:var(--brilho);display:block;}
.ag-palco .ag-logo-img{display:block;height:auto;}
.ag-palco .ag-marca-script{display:block;font-family:var(--script);font-size:68px;line-height:.9;color:var(--ouro);margin:2px 0 0 -3px;}
.ag-palco .ag-marca-assin{display:block;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-top:2px;}
.ag-palco .ag-abertura-acoes{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;padding-top:26px;}
.ag-palco .ag-abertura-acoes .ag-btn-cheio{margin-top:0;}

/* formulários */
.ag-palco .ag-tit-forma{margin:8px 0 18px;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.ag-palco .ag-grupo{margin-bottom:15px;}
.ag-palco .ag-rot{display:block;margin:0 0 7px;font-size:13.5px;font-weight:600;color:var(--soft);}
.ag-palco .ag-campo{width:100%;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:13px 13px;resize:none;-webkit-appearance:none;appearance:none;}
.ag-palco .ag-campo::placeholder{color:var(--fraco);}
.ag-palco .ag-campo:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px var(--ouro-cl);}
.ag-palco select.ag-campo{background-image:linear-gradient(45deg,transparent 50%,#A4959B 50%),linear-gradient(135deg,#A4959B 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;}
.ag-palco .ag-previa{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:13px;margin-bottom:16px;}
.ag-palco .ag-previa strong{display:block;font-family:var(--serif);font-size:16px;font-weight:600;}
.ag-palco .ag-previa span{font-size:11.5px;color:var(--fraco);}
.ag-palco .ag-grade-icones{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px;}
.ag-palco .ag-opcao-icone{display:grid;place-items:center;aspect-ratio:1;border-radius:11px;background:var(--sup);border:1.5px solid var(--linha);color:var(--soft);}
.ag-palco .ag-opcao-icone.sel{border-width:2px;}
.ag-palco .ag-grade-cores{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:4px;}
.ag-palco .ag-opcao-cor{display:grid;place-items:center;aspect-ratio:1;border-radius:11px;border:2px solid transparent;}
.ag-palco .ag-opcao-cor span{display:block;width:16px;height:16px;border-radius:50%;}
.ag-palco .ag-modulo-mini{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;flex-shrink:0;}
.ag-palco .ag-modulo-linha{display:flex;align-items:center;gap:10px;background:var(--sup);border:1px solid var(--linha);border-radius:13px;padding:12px 13px;}
.ag-palco .ag-modulo-txt{flex:1;min-width:0;}
.ag-palco .ag-modulo-txt strong{display:block;font-size:14px;font-weight:600;}
.ag-palco .ag-modulo-txt span{font-size:11.5px;color:var(--soft);}
.ag-palco .ag-modulo-acoes{display:flex;gap:2px;flex-shrink:0;}
.ag-palco .ag-modulo-acoes button{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--fraco);}
.ag-palco .ag-modulo-acoes button:disabled{opacity:.3;}
.ag-palco .ag-apagar-mod:hover{color:var(--erro);}
.ag-palco .ag-gira-cima{transform:rotate(-90deg);}
.ag-palco .ag-gira-baixo{transform:rotate(90deg);}
.ag-palco .ag-modulos{display:flex;flex-direction:column;gap:11px;}
.ag-palco .ag-modulo{display:block;width:100%;text-align:left;background:var(--sup);border:1.5px solid var(--linha);border-radius:18px;padding:18px;transition:transform .14s,box-shadow .14s;}
.ag-palco .ag-modulo-icone{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;margin-bottom:12px;}
.ag-palco .ag-modulo-nome{display:block;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2;}
.ag-palco .ag-modulo-qtd{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-top:5px;}
.ag-palco .ag-modulo-amostra{display:block;font-size:11.5px;line-height:1.45;color:var(--fraco);margin-top:10px;padding-top:10px;border-top:1px dashed var(--linha);}
.ag-palco .ag-voltar-cat{display:inline-flex;align-items:center;gap:5px;margin:4px 0 0;padding:8px 0;font-size:12.5px;font-weight:600;color:var(--ouro);}
.ag-palco .ag-grupo-proc + .ag-grupo-proc{margin-top:18px;}
.ag-palco .ag-categoria{margin:0 0 9px;font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--ouro);letter-spacing:-.005em;}
.ag-palco .ag-linha-conta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:14px;}
.ag-palco .ag-linha-conta span{display:block;font-size:12px;color:var(--soft);margin-bottom:2px;}
.ag-palco .ag-linha-conta strong{display:block;font-size:14.5px;font-weight:600;word-break:break-all;}
.ag-palco .ag-editar{background:var(--sup);border:1px solid var(--ouro);border-radius:14px;padding:14px;}
.ag-palco .ag-editar .ag-grupo:last-of-type{margin-bottom:0;}
.ag-palco .ag-sucesso{margin:0 0 11px;padding:11px 13px;border-radius:12px;background:var(--sage-cl);color:#3D4F37;font-size:13px;font-weight:600;line-height:1.4;}
.ag-palco .ag-senha{position:relative;display:flex;align-items:center;}
.ag-palco .ag-campo-senha{padding-right:52px;letter-spacing:.18em;font-variant-numeric:tabular-nums;}
.ag-palco .ag-olho{position:absolute;right:4px;display:grid;place-items:center;width:46px;height:46px;border-radius:11px;color:var(--fraco);background:none;}
.ag-palco .ag-erro{margin:7px 0 0;font-size:12.5px;line-height:1.45;color:var(--erro);font-weight:600;}
.ag-palco .ag-dica{margin:7px 0 0;font-size:12.5px;line-height:1.5;color:var(--fraco);}
.ag-palco .ag-par{display:flex;gap:8px;align-items:center;}
.ag-palco .ag-par > .ag-campo{flex:1;min-width:0;}
.ag-palco .ag-ate{font-size:12.5px;color:var(--soft);flex-shrink:0;}
.ag-palco .ag-lixo{display:grid;place-items:center;width:46px;height:46px;flex-shrink:0;border-radius:11px;color:var(--fraco);border:1px solid var(--linha);background:var(--sup);}

.ag-palco .ag-passos{display:flex;gap:5px;margin:6px 0 18px;}
.ag-palco .ag-passos span{flex:1;height:3px;border-radius:2px;background:var(--linha);}
.ag-palco .ag-passos span.feito{background:#D2C4A9;}
.ag-palco .ag-passos span.atual{background:var(--ouro);}

.ag-palco .ag-escolha{display:flex;flex-direction:column;gap:10px;}
.ag-palco .ag-escolha button{text-align:left;background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:5px;color:var(--ouro);transition:border-color .16s;}
.ag-palco .ag-escolha strong{font-size:16px;font-weight:700;color:var(--ink);}
.ag-palco .ag-escolha span{font-size:13.5px;line-height:1.5;color:var(--soft);}

.ag-palco .ag-teste{margin-top:26px;padding-top:16px;border-top:1px solid var(--linha);}
.ag-palco .ag-teste strong{display:block;font-size:12px;font-weight:700;color:var(--soft);}
.ag-palco .ag-teste p{margin:2px 0 9px;font-size:11.5px;color:var(--fraco);}
.ag-palco .ag-teste button{display:block;width:100%;text-align:left;font-size:12px;font-weight:600;color:var(--ouro);padding:8px 10px;border-radius:9px;background:var(--ouro-cl);margin-bottom:5px;}

.ag-palco .ag-proc-form{background:var(--sup);border:1px solid var(--linha);border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:8px;}
.ag-palco .ag-proc-form .ag-campo{background:var(--bg);}
.ag-palco .ag-novo-proc{margin-top:11px;background:var(--sup);border:1px dashed var(--linha);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.ag-palco .ag-novo-proc .ag-campo{background:var(--bg);}
.ag-palco .ag-novo-proc .ag-btn{margin-top:2px;}

/* conteúdo */

.ag-palco .ag-chave.on{background:var(--sage);}
.ag-palco .ag-chave.on span{transform:translateX(20px);}

.ag-palco .ag-ok{width:62px;height:62px;border-radius:50%;background:var(--sage-cl);color:var(--sage);display:grid;place-items:center;margin-bottom:16px;animation:pop .34s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ag-palco .ag-ok-tit{margin:0 0 8px;font-family:var(--serif);font-size:22px;font-weight:600;}
.ag-palco .ag-ok-txt{margin:0 0 8px;font-size:14.5px;line-height:1.55;color:var(--soft);max-width:32ch;}
.ag-palco .ag-vazio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:46px 20px;color:var(--fraco);}
.ag-palco .ag-vazio h4{margin:6px 0 0;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);}
.ag-palco .ag-vazio p{margin:0;font-size:14px;line-height:1.55;color:var(--soft);max-width:30ch;}

.ag-palco .ag-abas{display:flex;background:var(--sup);border-top:1px solid var(--linha);padding:8px 6px calc(10px + env(safe-area-inset-bottom));flex-shrink:0;}
.ag-palco .ag-abas button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--fraco);padding:6px 0;min-height:48px;}
.ag-palco .ag-abas button.sel{color:var(--ouro);}
.ag-palco .ag-abas-i{position:relative;display:grid;place-items:center;}

/* ── resposta ao ponteiro ──
   Dentro de @media (hover: hover) para que o estilo não fique grudado no
   celular: em tela de toque o navegador mantém o último elemento tocado em
   estado de hover, o que faz parecer que o botão ficou selecionado. */
@media (hover: hover) and (pointer: fine) {
  .ag-palco .ag-btn-linha:hover{background:var(--ouro-cl);border-color:var(--ouro);color:var(--ouro-esc);}
  .ag-palco .ag-btn-cheio:hover:not(:disabled){background:var(--ouro-esc);box-shadow:0 3px 12px rgba(88,69,32,.28);}
  .ag-palco .ag-btn-wa:hover{background:#17904a;box-shadow:0 3px 12px rgba(30,168,85,.3);}
  .ag-palco .ag-btn-escuro:hover{background:#1B1713;}

  .ag-palco .ag-prof:hover,.ag-palco .ag-proc:hover{border-color:var(--ouro);background:var(--ouro-cl);}
  .ag-palco .ag-escolha button:hover{border-color:var(--ouro);background:var(--ouro-cl);}
  .ag-palco .ag-hora:hover:not(:disabled){border-color:var(--ouro);background:var(--ouro-cl);color:var(--ouro-esc);}
  .ag-palco .ag-dia:hover:not(.sel){border-color:var(--ouro);background:var(--ouro-cl);}

  .ag-palco .ag-lixo:hover{color:var(--erro);border-color:#E3CDCD;background:#FBF2F2;}
  .ag-palco .ag-chave:hover{filter:brightness(.95);}
  .ag-palco .ag-abas button:hover:not(.sel){color:var(--soft);}
  .ag-palco .ag-sino:hover,.ag-palco .ag-voltar:hover{border-color:var(--ouro);color:var(--ouro);}
  .ag-palco .ag-olho:hover{color:var(--ouro);}
  .ag-palco .ag-linha-conta:hover{border-color:var(--ouro);background:var(--ouro-cl);}
  .ag-palco .ag-modulo:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(88,69,32,.14);}
  .ag-palco .ag-voltar-cat:hover{color:var(--ouro-esc);}
  .ag-palco .ag-modulo-acoes button:hover:not(:disabled){background:var(--ouro-cl);color:var(--ouro);}
  .ag-palco .ag-opcao-icone:hover{border-color:var(--ouro);color:var(--ouro);}
  .ag-palco .ag-opcao-cor:hover{transform:scale(1.08);}
  .ag-palco .ag-cel:hover:not(.sel){border-color:var(--ouro);background:var(--ouro-cl);}
  .ag-palco .ag-mes-seta:hover{border-color:var(--ouro);color:var(--ouro);}
  .ag-palco .ag-teste button:hover{background:#EADFC6;}
  .ag-palco .ag-dispensar:hover{color:var(--ink);}
  .ag-palco .ag-destaque:hover{filter:brightness(1.08);}
  .ag-palco .ag-aviso-linha:hover{filter:brightness(.97);}
  .ag-palco .ag-trilha-item.feito:hover{color:var(--ouro);}
}

@media (prefers-reduced-motion: reduce){.ag-palco *{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* telas estreitas: aproveita cada pixel */
@media (max-width:359px){
  .ag-palco .ag-tela{padding-left:14px;padding-right:14px;}
  .ag-palco .ag-horas{grid-template-columns:repeat(3,1fr);}
}

/* em monitor, mostra o app dentro de uma moldura de celular */
@media (min-width:600px){
  .ag-palco{background:var(--noite);align-items:center;justify-content:center;padding:22px 16px;min-height:100vh;}
  .ag-palco .ag-fone{max-width:412px;height:min(860px,calc(100vh - 44px));min-height:600px;border-radius:30px;box-shadow:0 26px 64px rgba(0,0,0,.45);}
}
