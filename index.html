@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Great+Vibes&family=Karla:wght@400;500;600;700&display=swap');

.ag-palco{
  --bg:#F5F3EF; --sup:#FFFFFF; --ink:#332F29; --soft:#756E63; --fraco:#A79D8E;
  --linha:#E7E1D6; --ouro:#8A6A2E; --ouro-esc:#584520; --ouro-cl:#F3ECDC;
  --sage:#5F7457; --sage-cl:#E7EEE3; --amb:#A85E3C; --amb-cl:#F7E8E0;
  --erro:#A6413F; --brilho:#C9A961; --noite:#2A2521;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --script:'Great Vibes','Brush Script MT',cursive;
  --sans:'Karla',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  min-height:100dvh; display:flex; flex-direction:column; align-items:stretch;
  padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.ag-palco *,.ag-palco *::before,.ag-palco *::after{box-sizing:border-box;}
.ag-palco button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;}
.ag-palco button:active{opacity:.72;}
.ag-palco button:disabled{cursor:not-allowed;}
.ag-palco :focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:4px;}

.ag-palco .ag-fone{
  width:100%;height:100dvh;background:var(--bg);overflow:hidden;
  display:flex;flex-direction:column;position:relative;
}

.ag-palco .ag-topo{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 10px;flex-shrink:0;min-height:56px;}
.ag-palco .ag-marca{display:inline-flex;align-items:center;gap:7px;font-family:var(--script);font-size:27px;line-height:1;color:var(--ouro);}
.ag-palco .ag-voltar{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sup);color:var(--ink);border:1px solid var(--linha);}
.ag-palco .ag-sino{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sup);border:1px solid var(--linha);color:var(--soft);}
.ag-palco .ag-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ouro);color:#fff;font-size:10px;font-weight:700;font-style:normal;display:grid;place-items:center;border:2px solid var(--bg);}
.ag-palco .ag-badge-peq{top:-5px;right:-8px;}

.ag-palco .ag-aviso{margin:2px 14px 8px;display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:12px;text-align:left;flex-shrink:0;animation:entra .28s ease-out;}
.ag-palco .ag-aviso.tipo-confirmado{background:var(--sage-cl);color:#3D4F37;}
.ag-palco .ag-aviso.tipo-recusado{background:#EFEAE2;color:#5A5349;}
.ag-palco .ag-aviso.tipo-novo{background:var(--amb-cl);color:#7A3F22;}
.ag-palco .ag-aviso-i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.7);flex-shrink:0;}
.ag-palco .ag-aviso-t{flex:1;font-size:13.5px;font-weight:600;line-height:1.35;}
@keyframes entra{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

.ag-palco .ag-corpo{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.ag-palco .ag-tela{padding:4px 18px 26px;display:flex;flex-direction:column;}
.ag-palco .ag-centro{align-items:center;justify-content:center;text-align:center;min-height:100%;}
.ag-palco .ag-centro-txt{text-align:center;}
.ag-palco .ag-ml{margin-left:auto;}
.ag-palco .ag-mt{margin-top:9px;}
.ag-palco .ag-mt-g{margin-top:26px;}
.ag-palco .ag-mb{margin-bottom:10px;}
.ag-palco .ag-larga{width:100%;}

/* abertura */
.ag-palco .ag-abertura{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:100%;padding:8px 22px 28px;overflow:hidden;}
.ag-palco .ag-abertura-topo{padding-top:18px;position:relative;z-index:1;}
.ag-palco .ag-marca-dagua{position:absolute;top:-56px;right:-96px;color:var(--ouro);opacity:.07;pointer-events:none;}
.ag-palco .ag-abertura-frase{margin:20px 0 0;font-size:16px;line-height:1.55;color:var(--soft);max-width:27ch;}
.ag-palco .ag-passos-lista{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:13px;}
.ag-palco .ag-passos-lista li{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;line-height:1.45;color:var(--ink);}
.ag-palco .ag-passo-icone{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--ouro-cl);color:var(--ouro);flex-shrink:0;}
.ag-palco .ag-topo-vazio{min-height:14px;padding-bottom:0;}
.ag-palco .ag-marca-bloco{display:flex;flex-direction:column;align-items:flex-start;}
.ag-palco .ag-simbolo{color:var(--brilho);display:block;}
.ag-palco .ag-logo-img{display:block;height:auto;}
.ag-palco .ag-marca-script{display:block;font-family:var(--script);font-size:68px;line-height:.9;color:var(--ouro);margin:2px 0 0 -3px;}
.ag-palco .ag-marca-assin{display:block;font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-top:2px;}
.ag-palco .ag-abertura-acoes{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;padding-top:26px;}
.ag-palco .ag-abertura-acoes .ag-btn-cheio{margin-top:0;}

/* formulários */
.ag-palco .ag-tit-forma{margin:8px 0 18px;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.ag-palco .ag-grupo{margin-bottom:15px;}
.ag-palco .ag-rot{display:block;margin:0 0 7px;font-size:13.5px;font-weight:600;color:var(--soft);}
.ag-palco .ag-campo{width:100%;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:13px 13px;resize:none;-webkit-appearance:none;appearance:none;}
.ag-palco .ag-campo::placeholder{color:var(--fraco);}
.ag-palco .ag-campo:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px var(--ouro-cl);}
.ag-palco select.ag-campo{background-image:linear-gradient(45deg,transparent 50%,#A4959B 50%),linear-gradient(135deg,#A4959B 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;}
.ag-palco .ag-previa{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:13px;margin-bottom:16px;}
.ag-palco .ag-previa strong{display:block;font-family:var(--serif);font-size:16px;font-weight:600;}
.ag-palco .ag-previa span{font-size:11.5px;color:var(--fraco);}
.ag-palco .ag-grade-icones{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px;}
.ag-palco .ag-opcao-icone{display:grid;place-items:center;aspect-ratio:1;border-radius:11px;background:var(--sup);border:1.5px solid var(--linha);color:var(--soft);}
.ag-palco .ag-opcao-icone.sel{border-width:2px;}
.ag-palco .ag-grade-cores{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:4px;}
.ag-palco .ag-opcao-cor{display:grid;place-items:center;aspect-ratio:1;border-radius:11px;border:2px solid transparent;}
.ag-palco .ag-opcao-cor span{display:block;width:16px;height:16px;border-radius:50%;}
.ag-palco .ag-modulo-mini{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;flex-shrink:0;}
.ag-palco .ag-modulo-linha{display:flex;align-items:center;gap:10px;background:var(--sup);border:1px solid var(--linha);border-radius:13px;padding:12px 13px;}
.ag-palco .ag-modulo-txt{flex:1;min-width:0;}
.ag-palco .ag-modulo-txt strong{display:block;font-size:14px;font-weight:600;}
.ag-palco .ag-modulo-txt span{font-size:11.5px;color:var(--soft);}
.ag-palco .ag-modulo-acoes{display:flex;gap:2px;flex-shrink:0;}
.ag-palco .ag-modulo-acoes button{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--fraco);}
.ag-palco .ag-modulo-acoes button:disabled{opacity:.3;}
.ag-palco .ag-apagar-mod:hover{color:var(--erro);}
.ag-palco .ag-gira-cima{transform:rotate(-90deg);}
.ag-palco .ag-gira-baixo{transform:rotate(90deg);}
.ag-palco .ag-modulos{display:flex;flex-direction:column;gap:11px;}
.ag-palco .ag-modulo{display:block;width:100%;text-align:left;background:var(--sup);border:1.5px solid var(--linha);border-radius:18px;padding:18px;transition:transform .14s,box-shadow .14s;}
.ag-palco .ag-modulo-icone{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;margin-bottom:12px;}
.ag-palco .ag-modulo-nome{display:block;font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2;}
.ag-palco .ag-modulo-qtd{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-top:5px;}
.ag-palco .ag-modulo-amostra{display:block;font-size:11.5px;line-height:1.45;color:var(--fraco);margin-top:10px;padding-top:10px;border-top:1px dashed var(--linha);}
.ag-palco .ag-voltar-cat{display:inline-flex;align-items:center;gap:5px;margin:4px 0 0;padding:8px 0;font-size:12.5px;font-weight:600;color:var(--ouro);}
.ag-palco .ag-grupo-proc + .ag-grupo-proc{margin-top:18px;}
.ag-palco .ag-categoria{margin:0 0 9px;font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--ouro);letter-spacing:-.005em;}
.ag-palco .ag-linha-conta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:14px;}
.ag-palco .ag-linha-conta span{display:block;font-size:12px;color:var(--soft);margin-bottom:2px;}
.ag-palco .ag-linha-conta strong{display:block;font-size:14.5px;font-weight:600;word-break:break-all;}
.ag-palco .ag-editar{background:var(--sup);border:1px solid var(--ouro);border-radius:14px;padding:14px;}
.ag-palco .ag-editar .ag-grupo:last-of-type{margin-bottom:0;}
.ag-palco .ag-sucesso{margin:0 0 11px;padding:11px 13px;border-radius:12px;background:var(--sage-cl);color:#3D4F37;font-size:13px;font-weight:600;line-height:1.4;}
.ag-palco .ag-senha{position:relative;display:flex;align-items:center;}
.ag-palco .ag-campo-senha{padding-right:52px;letter-spacing:.18em;font-variant-numeric:tabular-nums;}
.ag-palco .ag-olho{position:absolute;right:4px;display:grid;place-items:center;width:46px;height:46px;border-radius:11px;color:var(--fraco);background:none;}
.ag-palco .ag-erro{margin:7px 0 0;font-size:12.5px;line-height:1.45;color:var(--erro);font-weight:600;}
.ag-palco .ag-dica{margin:7px 0 0;font-size:12.5px;line-height:1.5;color:var(--fraco);}
.ag-palco .ag-par{display:flex;gap:8px;align-items:center;}
.ag-palco .ag-par > .ag-campo{flex:1;min-width:0;}
.ag-palco .ag-ate{font-size:12.5px;color:var(--soft);flex-shrink:0;}
.ag-palco .ag-lixo{display:grid;place-items:center;width:46px;height:46px;flex-shrink:0;border-radius:11px;color:var(--fraco);border:1px solid var(--linha);background:var(--sup);}

.ag-palco .ag-passos{display:flex;gap:5px;margin:6px 0 18px;}
.ag-palco .ag-passos span{flex:1;height:3px;border-radius:2px;background:var(--linha);}
.ag-palco .ag-passos span.feito{background:#D2C4A9;}
.ag-palco .ag-passos span.atual{background:var(--ouro);}

.ag-palco .ag-escolha{display:flex;flex-direction:column;gap:10px;}
.ag-palco .ag-escolha button{text-align:left;background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:5px;color:var(--ouro);transition:border-color .16s;}
.ag-palco .ag-escolha strong{font-size:16px;font-weight:700;color:var(--ink);}
.ag-palco .ag-escolha span{font-size:13.5px;line-height:1.5;color:var(--soft);}

.ag-palco .ag-teste{margin-top:26px;padding-top:16px;border-top:1px solid var(--linha);}
.ag-palco .ag-teste strong{display:block;font-size:12px;font-weight:700;color:var(--soft);}
.ag-palco .ag-teste p{margin:2px 0 9px;font-size:11.5px;color:var(--fraco);}
.ag-palco .ag-teste button{display:block;width:100%;text-align:left;font-size:12px;font-weight:600;color:var(--ouro);padding:8px 10px;border-radius:9px;background:var(--ouro-cl);margin-bottom:5px;}

.ag-palco .ag-proc-form{background:var(--sup);border:1px solid var(--linha);border-radius:13px;padding:11px;display:flex;flex-direction:column;gap:8px;}
.ag-palco .ag-proc-form .ag-campo{background:var(--bg);}
.ag-palco .ag-novo-proc{margin-top:11px;background:var(--sup);border:1px dashed var(--linha);border-radius:13px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.ag-palco .ag-novo-proc .ag-campo{background:var(--bg);}
.ag-palco .ag-novo-proc .ag-btn{margin-top:2px;}

/* conteúdo */
.ag-palco .ag-saudacao{margin:6px 0 18px;}
.ag-palco .ag-saudacao p{margin:0 0 3px;font-size:12.5px;color:var(--soft);}
.ag-palco .ag-saudacao h2{margin:0;font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;letter-spacing:-.02em;}
.ag-palco .ag-secao{margin:24px 0 11px;font-size:13.5px;font-weight:700;color:var(--soft);}
.ag-palco .ag-tela > .ag-secao:first-child{margin-top:10px;}
.ag-palco .ag-lista{display:flex;flex-direction:column;gap:9px;}

.ag-palco .ag-destaque{width:100%;text-align:left;background:var(--ouro-esc);color:#F5F0E6;border-radius:18px;padding:18px 18px 15px;display:block;position:relative;overflow:hidden;}
.ag-palco .ag-destaque::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.05);}
.ag-palco .ag-destaque-rot{display:block;font-size:11.5px;color:rgba(245,240,230,.6);margin-bottom:6px;}
.ag-palco .ag-destaque-hora{color:var(--brilho);display:block;font-family:var(--serif);font-size:44px;font-weight:500;line-height:.98;letter-spacing:-.03em;}
.ag-palco .ag-destaque-data{display:block;font-size:13px;margin-top:4px;color:rgba(245,240,230,.78);}
.ag-palco .ag-destaque-pe{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:600;}
.ag-palco .ag-destaque-com{font-weight:400;font-size:12px;color:rgba(245,240,230,.66);}
.ag-palco .ag-destaque-vazio{background:var(--sup);border:1px dashed var(--linha);color:var(--ink);}
.ag-palco .ag-destaque-vazio .ag-destaque-rot{color:var(--soft);}
.ag-palco .ag-destaque-vazio p{margin:0;font-size:13.5px;line-height:1.5;color:var(--soft);max-width:34ch;}

.ag-palco .ag-proximo{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--ouro-esc);color:#F5F0E6;border-radius:16px;padding:14px;margin-bottom:10px;}
.ag-palco .ag-proximo-hora{flex:0 0 auto;text-align:center;padding-right:13px;border-right:1px solid rgba(255,255,255,.16);}
.ag-palco .ag-proximo-hora strong{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1;color:var(--brilho);}
.ag-palco .ag-proximo-hora span{display:block;font-size:11px;margin-top:3px;color:rgba(245,240,230,.7);}
.ag-palco .ag-proximo-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.ag-palco .ag-proximo-rot{font-size:10.5px;color:rgba(245,240,230,.6);}
.ag-palco .ag-proximo-txt strong{font-size:14px;font-weight:700;}
.ag-palco .ag-proximo-txt > span:last-child{font-size:12px;color:rgba(245,240,230,.72);}
.ag-palco .ag-proximo .ag-seta{color:rgba(245,240,230,.6);}
.ag-palco .ag-prof-resumo{font-size:11.5px!important;color:var(--ouro)!important;font-weight:600;}
.ag-palco .ag-cartao-area{display:block;font-size:12.5px;color:var(--soft);margin-top:1px;}
.ag-palco .ag-cartao-local{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--fraco);margin-top:3px;}
.ag-palco .ag-proc-txt{flex:1;min-width:0;}
.ag-palco .ag-proc-tempo{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--soft);margin-top:3px;}
.ag-palco .ag-proc-preco{display:flex;align-items:center;gap:5px;flex-shrink:0;color:var(--fraco);}
.ag-palco .ag-aviso-linha{width:100%;margin-top:10px;display:flex;align-items:center;gap:7px;padding:11px 13px;border-radius:12px;background:var(--amb-cl);color:var(--amb);font-size:12.5px;font-weight:600;text-align:left;}

.ag-palco .ag-prof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sup);border:1px solid var(--linha);border-radius:15px;padding:14px;transition:border-color .16s;}
.ag-palco .ag-prof-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.ag-palco .ag-prof-txt strong{font-size:15.5px;font-weight:700;}
.ag-palco .ag-prof-txt span{font-size:13px;color:var(--soft);}
.ag-palco .ag-prof-local{display:inline-flex;align-items:center;gap:3px;color:var(--fraco)!important;font-size:11px!important;}
.ag-palco .ag-seta{color:var(--fraco);flex-shrink:0;}

.ag-palco .ag-ini{display:grid;place-items:center;border-radius:50%;font-weight:700;flex-shrink:0;}
.ag-palco .ag-ini-malva{background:var(--ouro-cl);color:var(--ouro);}
.ag-palco .ag-ini-sage{background:var(--sage-cl);color:var(--sage);}

.ag-palco .ag-cartao-prof{display:flex;gap:12px;align-items:flex-start;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:14px;}
.ag-palco .ag-cartao-prof strong{display:block;font-size:15px;font-family:var(--serif);font-weight:600;}
.ag-palco .ag-cartao-prof p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--soft);}

.ag-palco .ag-trilha{display:flex;gap:4px;margin:6px 0 16px;}
.ag-palco .ag-trilha-item{flex:1;font-size:11px;font-weight:600;color:var(--fraco);padding:0 0 7px;border-bottom:2px solid var(--linha);text-align:left;}
.ag-palco .ag-trilha-item.atual{color:var(--ouro);border-bottom-color:var(--ouro);}
.ag-palco .ag-trilha-item.feito{color:var(--soft);border-bottom-color:#D2C4A9;}

.ag-palco .ag-proc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:15px;transition:border-color .16s;}
.ag-palco .ag-proc.sel{border-color:var(--ouro);background:var(--ouro-cl);}
.ag-palco .ag-proc strong{display:block;font-size:15px;font-weight:600;margin-bottom:3px;}
.ag-palco .ag-proc span{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--soft);}
.ag-palco .ag-proc em{font-style:normal;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ouro);white-space:nowrap;}

.ag-palco .ag-dias{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;}
.ag-palco .ag-dias::-webkit-scrollbar{display:none;}
.ag-palco .ag-dia{flex:0 0 auto;width:58px;padding:11px 0 10px;border-radius:13px;background:var(--sup);border:1px solid var(--linha);display:flex;flex-direction:column;align-items:center;gap:1px;}
.ag-palco .ag-dia-sem{font-size:11.5px;color:var(--soft);}
.ag-palco .ag-dia strong{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1;}
.ag-palco .ag-dia-mes{font-size:11px;color:var(--fraco);}
.ag-palco .ag-dia.sel{background:var(--ouro);border-color:var(--ouro);color:#fff;}
.ag-palco .ag-dia.sel .ag-dia-sem,.ag-palco .ag-dia.sel .ag-dia-mes{color:rgba(255,255,255,.78);}
.ag-palco .ag-ponto{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:4px;}
.ag-palco .ag-dia.sel .ag-ponto{background:#fff;}

.ag-palco .ag-horas{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.ag-palco .ag-hora{padding:14px 0;border-radius:12px;background:var(--sup);border:1px solid var(--linha);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
.ag-palco .ag-hora:disabled{color:#C5BDB0;background:transparent;border-style:dashed;}
.ag-palco .ag-hora.sel{background:var(--ouro);border-color:var(--ouro);color:#fff;}

.ag-palco .ag-resumo{background:var(--sup);border:1px solid var(--linha);border-radius:14px;overflow:hidden;}
.ag-palco .ag-resumo-linha{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:13px 15px;border-bottom:1px solid var(--linha);}
.ag-palco .ag-resumo-linha:last-child{border-bottom:none;}
.ag-palco .ag-resumo-linha span{font-size:13px;color:var(--soft);flex-shrink:0;}
.ag-palco .ag-resumo-linha strong{font-size:14px;font-weight:600;text-align:right;}

.ag-palco .ag-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:700;padding:15px 18px;min-height:50px;border-radius:14px;transition:background .16s,border-color .16s,color .16s,box-shadow .16s;}
.ag-palco .ag-btn-cheio{background:var(--ouro);color:#fff;width:100%;margin-top:16px;}
.ag-palco .ag-btn-cheio:disabled{opacity:.42;}
.ag-palco .ag-btn-linha{background:var(--sup);border:1px solid var(--linha);color:var(--soft);}
.ag-palco .ag-btn-escuro{background:var(--ink);color:#fff;}
.ag-palco .ag-btn-wa{background:#1EA855;color:#fff;width:100%;margin-top:16px;}
.ag-palco .ag-btn-peq{padding:10px 14px;font-size:13px;min-height:40px;border-radius:11px;}
.ag-palco .ag-btn-wa.ag-btn-peq{width:auto;margin-top:10px;}
.ag-palco .ag-acoes{display:flex;gap:8px;margin-top:12px;}
.ag-palco .ag-acoes .ag-btn{flex:1;margin-top:0;}

.ag-palco .ag-pedido{background:var(--sup);border:1px solid var(--linha);border-radius:15px;padding:14px;position:relative;overflow:hidden;}
.ag-palco .ag-pedido::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
.ag-palco .ag-pedido.st-aguardando::before{background:#C07A4E;}
.ag-palco .ag-pedido.st-confirmado::before{background:var(--sage);}
.ag-palco .ag-pedido.st-recusado::before{background:#C3B9A6;}
.ag-palco .ag-pedido.st-cancelado::before{background:#B9AEA0;}
.ag-palco .ag-confirma-tit{display:block;font-size:14.5px;font-weight:700;margin-bottom:4px;}
.ag-palco .ag-mt-p{margin-top:6px;}
.ag-palco .ag-pedido-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px;}
.ag-palco .ag-pedido-topo strong{font-size:15.5px;font-weight:700;line-height:1.3;}
.ag-palco .ag-pedido-meta{display:flex;gap:16px;font-size:13.5px;color:var(--soft);}
.ag-palco .ag-pedido-meta span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;}
.ag-palco .ag-pedido-prof{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--linha);font-size:13.5px;color:var(--soft);}
.ag-palco .ag-pedido-prof em{margin-left:auto;font-style:normal;font-family:var(--serif);font-weight:600;font-size:14px;color:var(--ink);}
.ag-palco .ag-pedido-ok{margin:10px 0 0;font-size:12px;color:var(--sage);font-weight:600;}
.ag-palco .ag-pedido-cli{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.ag-palco .ag-pedido-cli strong{display:block;font-size:13.5px;font-weight:700;}
.ag-palco .ag-pedido-cli span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--soft);}
.ag-palco .ag-pedido-linha{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px;}
.ag-palco .ag-pedido-proc{font-size:15.5px;font-weight:700;}
.ag-palco .ag-pedido-linha em{font-style:normal;font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ouro);}

.ag-palco .ag-selo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.ag-palco .ag-selo-amb{background:var(--amb-cl);color:var(--amb);}
.ag-palco .ag-selo-sag{background:var(--sage-cl);color:var(--sage);}
.ag-palco .ag-selo-neu{background:#EFEAE2;color:#766F63;}

.ag-palco .ag-obs{margin-top:11px;background:var(--bg);border-radius:11px;padding:10px 12px;}
.ag-palco .ag-obs span{display:block;font-size:10.5px;font-weight:700;color:var(--fraco);margin-bottom:3px;}
.ag-palco .ag-obs p{margin:0;font-size:13.5px;line-height:1.5;color:var(--soft);}
.ag-palco .ag-motivo{margin-top:11px;padding-top:11px;border-top:1px solid var(--linha);}
.ag-palco .ag-motivo p{margin:0 0 4px;font-size:13.5px;line-height:1.5;color:var(--soft);}
.ag-palco .ag-recusa{margin-top:12px;padding-top:12px;border-top:1px solid var(--linha);}

.ag-palco .ag-avisar{background:var(--sup);border:1px solid var(--linha);border-left:3px solid #1EA855;border-radius:14px;padding:14px;margin:6px 0 16px;animation:entra .28s ease-out;}
.ag-palco .ag-avisar.nao{border-left-color:#C3B9A6;}
.ag-palco .ag-avisar strong{display:block;font-size:14px;font-weight:700;}
.ag-palco .ag-avisar p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--soft);}
.ag-palco .ag-avisar .ag-btn-wa{margin-top:12px;}
.ag-palco .ag-demo{display:flex;align-items:flex-start;gap:7px;padding:9px 14px calc(9px);background:#F3E9D8;color:#7A5A22;font-size:11.5px;line-height:1.4;font-weight:600;flex-shrink:0;padding-top:calc(9px + env(safe-area-inset-top));}
.ag-palco .ag-zerar{display:inline;padding:0;font-size:11.5px;font-weight:700;color:#7A5A22;text-decoration:underline;text-underline-offset:2px;}
.ag-palco .ag-demo svg{flex-shrink:0;margin-top:1px;}
.ag-palco .ag-demo + .ag-topo{padding-top:12px;}
.ag-palco .ag-mx{margin-left:18px;margin-right:18px;}
.ag-palco .ag-falha-forma{margin:0 0 14px;width:100%;text-align:left;}
.ag-palco .ag-falha{margin:2px 14px 8px;padding:11px 13px;border-radius:12px;background:#F7E6E5;color:#8C3A38;font-size:13px;font-weight:600;line-height:1.4;flex-shrink:0;}
.ag-palco .ag-espera-i{color:var(--ouro);margin-bottom:14px;}
.ag-palco .ag-elo{display:block;width:100%;margin-top:12px;padding:8px;font-size:13.5px;font-weight:600;color:var(--ouro);text-decoration:underline;text-underline-offset:3px;}
.ag-palco .ag-nota-tit{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.ag-palco .ag-nota p{margin:0;}
.ag-palco .ag-dispensar{display:block;width:100%;margin-top:8px;font-size:12px;font-weight:600;color:var(--fraco);padding:6px;}

.ag-palco .ag-dia-resumo{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 14px;padding:11px 14px;background:var(--sup);border:1px solid var(--linha);border-radius:13px;}
.ag-palco .ag-dia-resumo span{font-size:12.5px;color:var(--soft);}
.ag-palco .ag-dia-resumo strong{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ouro);}
.ag-palco .ag-slot{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--linha);}
.ag-palco .ag-slot:first-child{border-top:none;padding-top:0;}
.ag-palco .ag-slot-hora{flex:0 0 46px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums;}
.ag-palco .ag-slot-hora strong{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;}
.ag-palco .ag-slot-hora span{font-size:11px;color:var(--fraco);}
.ag-palco .ag-slot-corpo{flex:1;border-left:2px solid var(--sage);padding-left:13px;}
.ag-palco .ag-slot-corpo strong{display:block;font-size:15px;font-weight:700;}
.ag-palco .ag-slot-corpo > span{display:block;font-size:13.5px;color:var(--soft);margin-top:2px;}
.ag-palco .ag-slot-obs{margin:6px 0 0;font-size:11.5px;line-height:1.45;color:var(--fraco);}

.ag-palco .ag-perfil-prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 20px;text-align:center;}
.ag-palco .ag-perfil-prof h2{margin:6px 0 0;font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em;}
.ag-palco .ag-perfil-area{font-size:13.5px;color:var(--soft);}
.ag-palco .ag-perfil-selo{margin-top:4px;font-size:11.5px;font-weight:700;color:var(--sage);background:var(--sage-cl);padding:4px 10px;border-radius:20px;}
.ag-palco .ag-resumo-linha span svg{vertical-align:-2px;margin-right:4px;}
.ag-palco .ag-perfil-topo{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 20px;text-align:center;}
.ag-palco .ag-perfil-topo h2{margin:2px 0 0;font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.015em;}
.ag-palco .ag-perfil-topo p{margin:0;font-size:12.5px;color:var(--soft);}
.ag-palco .ag-proc-edit{display:flex;align-items:center;gap:10px;background:var(--sup);border:1px solid var(--linha);border-radius:13px;padding:12px 13px;transition:opacity .16s;}
.ag-palco .ag-proc-edit.off{opacity:.5;}
.ag-palco .ag-proc-edit-txt{flex:1;min-width:0;}
.ag-palco .ag-proc-edit strong{display:block;font-size:15px;font-weight:600;}
.ag-palco .ag-proc-edit span{font-size:12.5px;color:var(--soft);}
.ag-palco .ag-proc-edit .ag-lixo{width:32px;height:32px;border:none;background:none;}
.ag-palco .ag-chave{width:50px;height:30px;border-radius:14px;background:#DCD5C8;padding:3px;display:flex;flex-shrink:0;transition:background .2s;}
.ag-palco .ag-chave span{width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.ag-palco .ag-chave.on{background:var(--sage);}
.ag-palco .ag-chave.on span{transform:translateX(20px);}

.ag-palco .ag-ok{width:62px;height:62px;border-radius:50%;background:var(--sage-cl);color:var(--sage);display:grid;place-items:center;margin-bottom:16px;animation:pop .34s cubic-bezier(.2,1.4,.5,1);}
@keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.ag-palco .ag-ok-tit{margin:0 0 8px;font-family:var(--serif);font-size:22px;font-weight:600;}
.ag-palco .ag-ok-txt{margin:0 0 8px;font-size:14.5px;line-height:1.55;color:var(--soft);max-width:32ch;}
.ag-palco .ag-vazio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:46px 20px;color:var(--fraco);}
.ag-palco .ag-vazio h4{margin:6px 0 0;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--ink);}
.ag-palco .ag-vazio p{margin:0;font-size:14px;line-height:1.55;color:var(--soft);max-width:30ch;}

.ag-palco .ag-abas{display:flex;background:var(--sup);border-top:1px solid var(--linha);padding:8px 6px calc(10px + env(safe-area-inset-bottom));flex-shrink:0;}
.ag-palco .ag-abas button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--fraco);padding:6px 0;min-height:48px;}
.ag-palco .ag-abas button.sel{color:var(--ouro);}
.ag-palco .ag-abas-i{position:relative;display:grid;place-items:center;}

/* ── resposta ao ponteiro ──
   Dentro de @media (hover: hover) para que o estilo não fique grudado no
   celular: em tela de toque o navegador mantém o último elemento tocado em
   estado de hover, o que faz parecer que o botão ficou selecionado. */
@media (hover: hover) and (pointer: fine) {
  .ag-palco .ag-btn-linha:hover{background:var(--ouro-cl);border-color:var(--ouro);color:var(--ouro-esc);}
  .ag-palco .ag-btn-cheio:hover:not(:disabled){background:var(--ouro-esc);box-shadow:0 3px 12px rgba(88,69,32,.28);}
  .ag-palco .ag-btn-wa:hover{background:#17904a;box-shadow:0 3px 12px rgba(30,168,85,.3);}
  .ag-palco .ag-btn-escuro:hover{background:#1B1713;}

  .ag-palco .ag-prof:hover,.ag-palco .ag-proc:hover{border-color:var(--ouro);background:var(--ouro-cl);}
  .ag-palco .ag-escolha button:hover{border-color:var(--ouro);background:var(--ouro-cl);}
  .ag-palco .ag-hora:hover:not(:disabled){border-color:var(--ouro);background:var(--ouro-cl);color:var(--ouro-esc);}
  .ag-palco .ag-dia:hover:not(.sel){border-color:var(--ouro);background:var(--ouro-cl);}

  .ag-palco .ag-lixo:hover{color:var(--erro);border-color:#E3CDCD;background:#FBF2F2;}
  .ag-palco .ag-chave:hover{filter:brightness(.95);}
  .ag-palco .ag-abas button:hover:not(.sel){color:var(--soft);}
  .ag-palco .ag-sino:hover,.ag-palco .ag-voltar:hover{border-color:var(--ouro);color:var(--ouro);}
  .ag-palco .ag-olho:hover{color:var(--ouro);}
  .ag-palco .ag-linha-conta:hover{border-color:var(--ouro);background:var(--ouro-cl);}
  .ag-palco .ag-modulo:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(88,69,32,.14);}
  .ag-palco .ag-voltar-cat:hover{color:var(--ouro-esc);}
  .ag-palco .ag-modulo-acoes button:hover:not(:disabled){background:var(--ouro-cl);color:var(--ouro);}
  .ag-palco .ag-opcao-icone:hover{border-color:var(--ouro);color:var(--ouro);}
  .ag-palco .ag-opcao-cor:hover{transform:scale(1.08);}
  .ag-palco .ag-teste button:hover{background:#EADFC6;}
  .ag-palco .ag-dispensar:hover{color:var(--ink);}
  .ag-palco .ag-destaque:hover{filter:brightness(1.08);}
  .ag-palco .ag-aviso-linha:hover{filter:brightness(.97);}
  .ag-palco .ag-trilha-item.feito:hover{color:var(--ouro);}
}

@media (prefers-reduced-motion: reduce){.ag-palco *{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* telas estreitas: aproveita cada pixel */
@media (max-width:359px){
  .ag-palco .ag-tela{padding-left:14px;padding-right:14px;}
  .ag-palco .ag-horas{grid-template-columns:repeat(3,1fr);}
}

/* em monitor, mostra o app dentro de uma moldura de celular */
@media (min-width:600px){
  .ag-palco{background:var(--noite);align-items:center;justify-content:center;padding:22px 16px;min-height:100vh;}
  .ag-palco .ag-fone{max-width:412px;height:min(860px,calc(100vh - 44px));min-height:600px;border-radius:30px;box-shadow:0 26px 64px rgba(0,0,0,.45);}
}
